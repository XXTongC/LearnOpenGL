# Renderer frame pass plan for PBR render-path experiments.
# Copy to config/renderer_frame_pass.local.ini for local experiments.

defaultPassOrder=BeginFrame,ShadowMaps,PBRShadowAtlas,PBRDepthPrepass,LegacyOpaqueScene,PBROpaqueScene,LegacyTransparentScene,PBRTransparentScene
globalMaterialOverridePassOrder=BeginFrame,ShadowMaps,GlobalMaterialScene

# Optional/default PBR pass keys: PBRShadowAtlas, PBRGBuffer, PBRDeferredLighting, PBRDeferredTiledLightDebug, PBRGBufferDebug, IBLDebug.
# Remove PBRShadowAtlas from defaultPassOrder to skip the extra atlas render pass and fall back to legacy CSM binding.
# Example: insert PBRGBuffer after PBRDepthPrepass to produce deferred PBR geometry buffers.
# Example: append PBRDeferredLighting after PBRGBuffer to shade the current G-buffer.
# Example: append PBRDeferredTiledLightDebug after PBRGBuffer to visualize tiled point-light occupancy.
# Example: append PBRGBufferDebug after scene passes to visualize the current G-buffer.
# pbrGBufferDebugMode values: 0 Albedo, 1 Normal, 2 Roughness, 3 Metallic, 4 AO, 5 Depth, 6 World Position, 7 Emissive, 8 IBL Params.
# Example: append IBLDebug to defaultPassOrder to show the selected IBL resource in the scene color target.
pbrDeferredLightingIntensity=1
pbrDeferredIblDiffuseStrength=1
pbrDeferredIblSpecularStrength=1
pbrDeferredTiledLightsEnabled=true
pbrDeferredTileSize=16
pbrDeferredTiledLightCutoff=0.01
pbrDeferredTiledLightDebugMaxLights=2
pbrDeferredTiledLightDebugIntensity=1
pbrGBufferDebugMode=0
pbrGBufferDebugIntensity=1
iblDebugMode=0
iblDebugMipLevel=0
iblDebugIntensity=1
