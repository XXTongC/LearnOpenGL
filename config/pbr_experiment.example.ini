# PBR experiment preset example.
# Runtime local override path: config/pbr_experiment.local.ini, which is ignored by git.
# This file is loaded after environment_profile, postprocess_settings, and pbr_preview.
enabled=1

environment.precomputeOnPrepare=1
environment.useProceduralEnvironment=1
environment.proceduralWidth=128
environment.proceduralHeight=64
environment.proceduralSkyIntensity=1.5
environment.proceduralGroundIntensity=0.15
environment.proceduralSunIntensity=4.0

postprocess.exposure=1.0
postprocess.toneMappingMode=0
postprocess.bloomEnabled=1
postprocess.bloomThreshold=1.0
postprocess.bloomIntensity=0.04
postprocess.bloomIterations=6

pbrPreview.enabled=1
pbrPreview.positionX=2.0
pbrPreview.positionY=-3.9
pbrPreview.positionZ=2.0
pbrPreview.segments=32
pbrPreview.rings=16
pbrPreview.useMaterialGrid=1
pbrPreview.gridColumns=5
pbrPreview.gridRows=5
pbrPreview.gridSpacing=1.1
pbrPreview.gridRadius=0.42
pbrPreview.gridMetallicMin=0.0
pbrPreview.gridMetallicMax=1.0
pbrPreview.gridRoughnessMin=0.08
pbrPreview.gridRoughnessMax=1.0
pbrPreview.materialProfilePath=config/pbr_material.example.ini
pbrPreview.albedoR=0.9
pbrPreview.albedoG=0.42
pbrPreview.albedoB=0.18
pbrPreview.ao=1.0
pbrPreview.emissiveR=0.0
pbrPreview.emissiveG=0.0
pbrPreview.emissiveB=0.0
pbrPreview.emissiveIntensity=0.0
pbrPreview.useIBL=1
pbrPreview.iblDiffuseStrength=1.0
pbrPreview.iblSpecularStrength=1.0
pbrPreview.normalMapPath=Texture/normal/normal_map.png
pbrPreview.normalMapUnit=4

